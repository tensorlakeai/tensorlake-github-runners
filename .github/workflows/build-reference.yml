name: Build reference example

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, tensorlake, tensorlake-small]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify persistent cache mount
        shell: bash
        run: |
          if [[ -z "${TENSORLAKE_CACHE_DIR:-}" ]]; then
            echo "::error::The runner did not provide a persistent cache directory."
            exit 1
          fi
          if ! mountpoint -q "${TENSORLAKE_CACHE_DIR}"; then
            echo "::error::${TENSORLAKE_CACHE_DIR} is not a mounted Cloud Volume."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-local-path: /mnt/tensorlake-cache/uv

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build Python package
        run: uv build

      - name: Lint Python
        run: uv run --no-sync ruff check github_runner_orchestrator tests

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check github_runner_orchestrator tests

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Verify Docker
        run: docker run --rm hello-world
